# Pages are statically generated and posts dated in the future are hidden at build time:
# rebuild the site on the day a post is scheduled so it goes live without a manual deploy,
# then open an issue reminding to share it on LinkedIn.
name: Publish scheduled posts

on:
  schedule:
    - cron: '0 5 * * *' # 06:00/07:00 in Italy
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if no post is scheduled for today'
        type: boolean
        default: false
      remind:
        description: 'Send the LinkedIn reminder for this post slug (to resend it or test it)'
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find posts scheduled for today
        id: today
        run: |
          today=$(date -u +%F)
          slugs=$( (grep -lE "^publishedAt: ['\"]?${today}" app/blog/posts/*.mdx || true) |
            xargs -r -n1 basename -s .mdx | tr '\n' ' ')
          echo "Posts scheduled for ${today}: ${slugs:-none}"
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook
        if: steps.today.outputs.slugs != '' || inputs.force
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL is not set"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      - name: Remind to share on LinkedIn
        if: steps.today.outputs.slugs != '' || inputs.remind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUGS: ${{ steps.today.outputs.slugs }} ${{ inputs.remind }}
        run: |
          read -ra slugs <<< "$SLUGS"
          .github/scripts/linkedin-reminder.sh "${slugs[@]}"
